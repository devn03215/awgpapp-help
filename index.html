<!DOCTYPE html>
<html lang="en" data-base="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="AWGP Help Center — guides for audio, rituals, library, daily thought, and troubleshooting." />
  <title>AWGP Help Center</title>
  <link rel="icon" href="assets/icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="index.html">
        <img src="assets/icon.png" width="40" height="40" alt="AWGP" />
        <span class="brand-text">
          <span class="brand-name">AWGP</span>
          <span class="brand-sub">Help Center</span>
        </span>
      </a>
      <a class="header-link" href="https://www.awgp.org" rel="noopener">awgp.org</a>
    </header>

    <section class="hero">
      <h1>How can we help? 👋</h1>
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input
          id="help-search"
          class="search-input"
          type="search"
          placeholder="Search for articles…"
          autocomplete="off"
          aria-label="Search help articles"
        />
        <div id="search-results" class="search-results" role="listbox"></div>
      </div>
    </section>

    <p class="section-label">Browse by topic</p>
    <div id="category-grid" class="category-grid"></div>

    <p class="section-label">Suggested articles</p>
    <div id="suggested-list" class="suggested-list"></div>

    <section class="contact-card">
      <h2>Contact us</h2>
      <p>Can’t find what you need? Reach out and we’ll get back to you.</p>
      <a class="btn" href="contact.html">Contact support</a>
    </section>

    <footer class="site-footer">
      <p>
        © All World Gayatri Pariwar ·
        <a href="https://www.awgp.org" rel="noopener">awgp.org</a> ·
        <a href="https://devn03215.github.io/privacy-policy/" rel="noopener">Privacy</a>
      </p>
    </footer>
  </div>

  <script src="js/articles.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
